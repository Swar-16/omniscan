name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache OpenCV SDK
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: C:\opencv
          key: opencv-4.10.0-windows-x64
      - name: Download & Extract OpenCV SDK
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $url = "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe"
          $out = "$env:RUNNER_TEMP\opencv-4.10.0.exe"
          $expectedHash = "bff38466091c313dac21a0b73eea8278316a89c1d434c6f0b10697e087670168"
          
          Write-Host "Downloading OpenCV 4.10.0 Windows SDK..."
          Invoke-WebRequest -Uri $url -OutFile $out
          
          $actualHash = (Get-FileHash -Path $out -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
              Write-Error "OpenCV SDK SHA-256 verification FAILED!`nExpected: $expectedHash`nActual:   $actualHash"
              exit 1
          }
          Write-Host "OpenCV SDK SHA-256 verification passed: $actualHash"
          
          tar -xf $out -C "C:\"
          Remove-Item $out -Force
      - name: Configure OpenCV Environment
        shell: powershell
        run: |
          "OPENCV_INCLUDE_PATHS=C:\opencv\build\include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENCV_LINK_PATHS=C:\opencv\build\x64\vc16\lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENCV_LINK_LIBS=opencv_world4100" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "C:\opencv\build\x64\vc16\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets
