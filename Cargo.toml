[package]
name = "omniscan"
version = "0.1.0"
edition = "2021"
authors = ["Swarnava Banerjee"]
description = "A local-first, configurable Optical Mark Recognition (OMR) platform"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
